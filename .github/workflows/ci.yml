name: CI

# check:  lint + format + parse + unit tests + boot, on every push and PR.
# web:    export the Web build (proves the export works), on every push and PR.
# deploy: publish the Web build to GitHub Pages, only from main.
#         One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, test, boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Read pinned Godot version
        run: |
          echo "GODOT_VERSION=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        run: GODOT_BIN_DIR="$HOME/.local/bin" tools/install_godot.sh

      - name: Run checks
        run: tools/check.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: |
            build/*.log
            build/test-results.xml
          if-no-files-found: ignore

  web:
    name: Export Web build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Godot version
        run: |
          echo "GODOT_VERSION=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Godot and Web export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-web-templates

      - name: Install Godot and Web export templates
        run: GODOT_BIN_DIR="$HOME/.local/bin" tools/install_godot.sh --web-templates

      - name: Export Web build
        run: tools/export_web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
